# Проверка профиля WARP из приложения: без TUN и правил
mixed-port: 7891
external-controller: 127.0.0.1:9091
log-level: warning
ipv6: true
mode: rule

proxy-providers:
  warp:
    type: file
    path: ./warp.yaml

proxy-groups:
  - name: WARP
    type: fallback
    use:
      - warp

rules:
  - MATCH,WARP
