name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Версия релиза, например v0.2.0"
        required: true
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false

      - name: Версия
        id: ver
        shell: pwsh
        run: |
          $v = if ("${{ github.event.inputs.version }}") { "${{ github.event.inputs.version }}" } else { "${{ github.ref_name }}" }
          "tag=$v" >> $env:GITHUB_OUTPUT

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            source/target
          key: cargo-${{ hashFiles('source/Cargo.lock') }}

      - name: Тесты и сборка
        working-directory: source
        run: |
          cargo test --locked
          cargo build --release --locked

      - name: Собрать архив
        shell: pwsh
        run: |
          $name = "WarpUnblock-${{ steps.ver.outputs.tag }}-win-x64"
          $dir = "dist/WarpUnblock"
          New-Item -ItemType Directory -Force $dir | Out-Null
          Copy-Item source/target/release/warp-unblock.exe "$dir/WarpUnblock.exe"
          Copy-Item app "$dir/app" -Recurse
          Copy-Item docs/README.md "$dir/README.md"
          Copy-Item LICENSE, THIRD_PARTY.md $dir
          Compress-Archive -Path $dir -DestinationPath "dist/$name.zip" -CompressionLevel Optimal
          (Get-FileHash "dist/$name.zip" -Algorithm SHA256).Hash.ToLower() + "  $name.zip" | Set-Content "dist/$name.zip.sha256"
          "ZIP=dist/$name.zip" >> $env:GITHUB_ENV

      - name: Опубликовать релиз
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ steps.ver.outputs.tag }}"
          $notes = "Распакуйте архив в любую папку и запустите ``WarpUnblock/WarpUnblock.exe`` (нужны права администратора). Windows x64. Подробности — README.md внутри архива."
          gh release create $tag $env:ZIP "$($env:ZIP).sha256" --title $tag --notes $notes --target ${{ github.sha }}
