name: Android

on:
  # Проверка на push/PR; релиз собирает release.yml, вызывая этот файл с версией.
  push:
    branches: [main]
    paths: ["android/**", ".github/workflows/android.yml"]
  pull_request:
    paths: ["android/**", ".github/workflows/android.yml"]
  workflow_call:
    inputs:
      version:
        type: string
        required: true

permissions:
  contents: read

env:
  MIHOMO_VERSION: v1.19.33
  HEV_VERSION: 2.9.3
  BYEDPI_VERSION: v0.8.1

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Версия
        id: ver
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          v="${INPUT_VERSION:-v0.0.0}"   # без версии — проверочная сборка ветки/PR
          v="${v#v}"
          IFS=. read -r major minor patch <<< "$v"
          # versionCode растёт вместе с версией: 0.7.0 → 700 (у android-v0.3.1 было 10).
          code=$(( major * 10000 + minor * 100 + patch ))
          echo "name=$v" >> "$GITHUB_OUTPUT"
          echo "code=$(( code > 0 ? code : 1 ))" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Ядро mihomo (android arm64-v8 и armv7)
        run: |
          set -e
          for pair in "arm64-v8a:android-arm64-v8" "armeabi-v7a:android-armv7"; do
            abi="${pair%%:*}"; asset="${pair##*:}"
            mkdir -p "android/app/src/main/jniLibs/$abi"
            curl -fsSL -o /tmp/mihomo.gz "https://github.com/MetaCubeX/mihomo/releases/download/${MIHOMO_VERSION}/mihomo-${asset}-${MIHOMO_VERSION}.gz"
            gunzip -c /tmp/mihomo.gz > "android/app/src/main/jniLibs/$abi/libmihomo.so"
            chmod +x "android/app/src/main/jniLibs/$abi/libmihomo.so"
            sha256sum "android/app/src/main/jniLibs/$abi/libmihomo.so"
          done

      - name: tun2socks (hev-socks5-tunnel) через NDK
        run: |
          set -e
          git clone --depth 1 --branch "$HEV_VERSION" --recursive https://github.com/heiher/hev-socks5-tunnel /tmp/hev
          cd /tmp/hev
          "$ANDROID_NDK_HOME/ndk-build" NDK_PROJECT_PATH=. APP_BUILD_SCRIPT=Android.mk NDK_APPLICATION_MK=Application.mk APP_ABI="arm64-v8a armeabi-v7a" -j"$(nproc)"
          for abi in arm64-v8a armeabi-v7a; do
            cp "libs/$abi/libhev-socks5-tunnel.so" "$GITHUB_WORKSPACE/android/app/src/main/jniLibs/$abi/"
          done

      - name: ByeDPI (обход DPI для регистрации WARP) через NDK
        run: |
          set -e
          git clone --depth 1 --branch "$BYEDPI_VERSION" https://github.com/hufrea/byedpi /tmp/byedpi
          cd /tmp/byedpi
          TC="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          for pair in "arm64-v8a:aarch64-linux-android24-clang" "armeabi-v7a:armv7a-linux-androideabi24-clang"; do
            abi="${pair%%:*}"; cc="${pair##*:}"
            make clean >/dev/null 2>&1 || true
            make CC="$TC/$cc"
            cp ciadpi "$GITHUB_WORKSPACE/android/app/src/main/jniLibs/$abi/libbyedpi.so"
            chmod +x "$GITHUB_WORKSPACE/android/app/src/main/jniLibs/$abi/libbyedpi.so"
          done

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Сборка APK
        env:
          VERSION_NAME: ${{ steps.ver.outputs.name }}
          VERSION_CODE: ${{ steps.ver.outputs.code }}
        run: gradle -p android testDebugUnitTest assembleRelease lintRelease --no-daemon

      - name: Собрать файлы релиза
        if: inputs.version != ''
        run: |
          set -e
          mkdir dist
          for abi in arm64-v8a armeabi-v7a; do
            src="android/app/build/outputs/apk/release/app-$abi-release.apk"
            test -f "$src"
            cp "$src" "dist/WarpUnblock-android-v${{ steps.ver.outputs.name }}-$abi.apk"
          done
          ls -la dist

      - uses: actions/upload-artifact@v4
        if: inputs.version != ''
        with:
          name: android
          path: dist/*.apk
          if-no-files-found: error
