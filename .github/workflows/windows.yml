name: Windows

on:
  # Проверка на push/PR; релиз собирает release.yml, вызывая этот файл с версией.
  push:
    branches: [main]
    paths: ["windows/**", ".github/workflows/windows.yml"]
  pull_request:
    # Метка `packages` на PR — собрать release и пакеты в артефакты для ручного теста.
    types: [opened, synchronize, reopened, labeled]
    paths: ["windows/**", ".github/workflows/windows.yml"]
  workflow_call:
    inputs:
      version:
        type: string
        required: true
  # Ручная сборка для теста: всё как в релизе (release + пакеты в артефакты), без публикации.
  workflow_dispatch:
    inputs:
      version:
        description: "Версия в сборке, например v0.7.8"
        type: string
        required: true
        default: v0.7.8

permissions:
  contents: read

# Новый пуш в PR отменяет прошлую проверку; релиз (тег) не отменяется.
concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  # Тесты без debuginfo: быстрее сборка и меньше кэш.
  CARGO_PROFILE_DEV_DEBUG: "0"

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false

      - name: Версия
        id: ver
        shell: pwsh
        run: |
          # Без версии (PR, push) — версия из Cargo.toml: тестовая сборка не предлагает обновиться.
          $v = if ("${{ inputs.version }}") { "${{ inputs.version }}" } else {
            "v" + (Select-String -Path windows/source/Cargo.toml -Pattern '^version = "(.*)"' | Select-Object -First 1).Matches.Groups[1].Value
          }
          "tag=$v" >> $env:GITHUB_OUTPUT

      - uses: dtolnay/rust-toolchain@stable

      # Кэш зависимостей: ключ учитывает версию rustc и Cargo.lock. PR и тег берут кэш main;
      # кэш тега никому больше не виден, поэтому его не сохраняем.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: windows/source
          shared-key: windows
          save-if: ${{ !startsWith(github.ref, 'refs/tags/') }}

      # PR и push: тесты (debug). Релиз их не гоняет — коммит уже проверен в main.
      - name: Тесты
        if: inputs.version == ''
        working-directory: windows/source
        run: cargo test --locked

      # Release (LTO) — долгая: только push в main (заодно греет кэш для релиза) и релиз.
      - name: Сборка
        if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'packages')
        working-directory: windows/source
        env:
          WARP_VERSION: ${{ steps.ver.outputs.tag }}
        run: cargo build --release --locked

      - name: Собрать архив
        if: inputs.version != '' || contains(github.event.pull_request.labels.*.name, 'packages')
        shell: pwsh
        run: |
          # В корне архива: README.md и папка WarpUnblock (exe + app). Лицензии — в app/licenses.
          $name = "WarpUnblock-${{ steps.ver.outputs.tag }}-win-x64"
          $stage = "dist/stage"
          $dir = "$stage/WarpUnblock"
          New-Item -ItemType Directory -Force $dir | Out-Null
          Copy-Item windows/source/target/release/warp-unblock.exe "$dir/WarpUnblock.exe"
          Copy-Item windows/app "$dir/app" -Recurse
          New-Item -ItemType Directory -Force "$dir/app/licenses" | Out-Null
          Copy-Item LICENSE "$dir/app/licenses/LICENSE.txt"
          Copy-Item THIRD_PARTY.md "$dir/app/licenses/THIRD-PARTY.txt"
          Copy-Item windows/README.md "$stage/README.md"
          Compress-Archive -Path "$stage/*" -DestinationPath "dist/$name.zip" -CompressionLevel Optimal
          (Get-FileHash "dist/$name.zip" -Algorithm SHA256).Hash.ToLower() + "  $name.zip" | Set-Content "dist/$name.zip.sha256"
          "ZIP=dist/$name.zip" >> $env:GITHUB_ENV

      - uses: actions/upload-artifact@v4
        if: inputs.version != '' || contains(github.event.pull_request.labels.*.name, 'packages')
        with:
          name: windows
          path: |
            dist/*.zip
            dist/*.zip.sha256
          if-no-files-found: error
