name: Windows

on:
  # Проверка на push/PR; релиз собирает release.yml, вызывая этот файл с версией.
  push:
    branches: [main]
    paths: ["windows/**", ".github/workflows/windows.yml"]
  pull_request:
    paths: ["windows/**", ".github/workflows/windows.yml"]
  workflow_call:
    inputs:
      version:
        type: string
        required: true

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false

      - name: Версия
        id: ver
        shell: pwsh
        run: |
          $v = if ("${{ inputs.version }}") { "${{ inputs.version }}" } else { "v0.0.0" }
          "tag=$v" >> $env:GITHUB_OUTPUT

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            windows/source/target
          key: cargo-${{ hashFiles('windows/source/Cargo.lock') }}
          restore-keys: cargo-

      - name: Тесты и сборка
        working-directory: windows/source
        env:
          WARP_VERSION: ${{ steps.ver.outputs.tag }}
        run: |
          cargo test --locked
          cargo build --release --locked

      - name: Собрать архив
        if: inputs.version != ''
        shell: pwsh
        run: |
          # В корне архива: README.md и папка WarpUnblock (exe + app). Лицензии — в app/licenses.
          $name = "WarpUnblock-${{ steps.ver.outputs.tag }}-win-x64"
          $stage = "dist/stage"
          $dir = "$stage/WarpUnblock"
          New-Item -ItemType Directory -Force $dir | Out-Null
          Copy-Item windows/source/target/release/warp-unblock.exe "$dir/WarpUnblock.exe"
          Copy-Item windows/app "$dir/app" -Recurse
          New-Item -ItemType Directory -Force "$dir/app/licenses" | Out-Null
          Copy-Item LICENSE "$dir/app/licenses/LICENSE.txt"
          Copy-Item THIRD_PARTY.md "$dir/app/licenses/THIRD-PARTY.txt"
          Copy-Item windows/README.md "$stage/README.md"
          Compress-Archive -Path "$stage/*" -DestinationPath "dist/$name.zip" -CompressionLevel Optimal
          (Get-FileHash "dist/$name.zip" -Algorithm SHA256).Hash.ToLower() + "  $name.zip" | Set-Content "dist/$name.zip.sha256"
          "ZIP=dist/$name.zip" >> $env:GITHUB_ENV

      - uses: actions/upload-artifact@v4
        if: inputs.version != ''
        with:
          name: windows
          path: |
            dist/*.zip
            dist/*.zip.sha256
          if-no-files-found: error
